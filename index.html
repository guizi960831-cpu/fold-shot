<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>折叠屏截图</title>
<style>
:root{--bg:#f2f2f4;--fg:#16161a;--card:#fff;--line:#d9d9de;--acc:#1b4dff;--mut:#6b6b75;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101013;--fg:#f1f1f4;--card:#1b1b20;--line:#33333a;--acc:#6f8bff;--mut:#9a9aa6}}
:root[data-theme="dark"]{--bg:#101013;--fg:#f1f1f4;--card:#1b1b20;--line:#33333a;--acc:#6f8bff;--mut:#9a9aa6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;padding:16px;max-width:560px;margin-inline:auto}
h1{font-size:20px;margin:4px 0 14px;font-weight:700}
.stage{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;justify-content:center}
canvas{width:100%;height:auto;display:block;max-height:60vh;object-fit:contain}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.lab{font-size:13px;color:var(--mut);width:64px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.btn{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:8px 12px;border-radius:10px;font-size:14px}
.seg button.on{border-color:var(--acc);color:var(--acc);font-weight:600}
.big{display:flex;gap:8px;margin-top:16px}
.big .btn{flex:1;padding:13px;font-size:16px}
.big .pri{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.msg{font-size:13px;color:var(--mut);margin-top:10px;min-height:18px}
.pick{position:relative;overflow:hidden}
.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:0;cursor:pointer}
</style>
</head>
<body>
<h1>折叠屏截图</h1>
<div class="stage"><canvas id="c"></canvas></div>

<div class="row"><span class="lab">填充</span><div class="seg" data-k="fit">
<button data-v="blur" class="on">模糊铺底</button><button data-v="contain">居中</button><button data-v="cover">铺满裁切</button></div></div>
<div class="row"><span class="lab">边框</span><div class="seg" data-k="color">
<button data-v="#0c0c0e" class="on">曜黑</button><button data-v="#c9ccd1">银</button><button data-v="#1d2a44">深蓝</button></div></div>
<div class="row"><span class="lab">状态栏</span><div class="seg" data-k="bar"><button data-v="1" class="on">显示</button><button data-v="0">隐藏</button></div></div>
<div class="row"><span class="lab">折痕</span><div class="seg" data-k="crease"><button data-v="1" class="on">显示</button><button data-v="0">隐藏</button></div></div>

<div class="big">
<div class="btn pri pick" style="text-align:center">选择截图<input id="f" type="file" accept="image/*"></div>
<button class="btn" id="save">保存图片</button>
</div>
<div class="msg" id="msg">先选一张截图。</div>

<script>
const S={fit:'blur',color:'#0c0c0e',bar:'1',crease:'1'};
let img=null;
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),msg=document.getElementById('msg');
const SW=1092,SH=984,B=28,M=40,K=2;
const FW=SW+B*2,FH=SH+B*2,W=FW+M*2,H=FH+M*2;
cv.width=W*K;cv.height=H*K;

function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function draw(){
  ctx.setTransform(K,0,0,K,0,0);
  ctx.clearRect(0,0,W,H);
  // shadow + body
  ctx.save();ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=40;ctx.shadowOffsetY=14;
  ctx.fillStyle=S.color;rr(M,M,FW,FH,64);ctx.fill();ctx.restore();
  ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=2;rr(M+1,M+1,FW-2,FH-2,63);ctx.stroke();
  const sx=M+B,sy=M+B;
  ctx.save();rr(sx,sy,SW,SH,38);ctx.clip();
  ctx.fillStyle='#000';ctx.fillRect(sx,sy,SW,SH);
  if(img){
    const iw=img.width,ih=img.height;
    const cover=Math.max(SW/iw,SH/ih),contain=Math.min(SW/iw,SH/ih);
    const put=(s)=>ctx.drawImage(img,sx+(SW-iw*s)/2,sy+(SH-ih*s)/2,iw*s,ih*s);
    if(S.fit==='cover')put(cover);
    else{
      if(S.fit==='blur'){
        try{ctx.filter='blur(36px) brightness(.7)'}catch(e){}
        put(cover*1.15);ctx.filter='none';
      }
      put(contain);
    }
  }else{
    ctx.fillStyle='#16161a';ctx.fillRect(sx,sy,SW,SH);
    ctx.fillStyle='#8a8a96';ctx.font='36px sans-serif';ctx.textAlign='center';
    ctx.fillText('选择一张截图',sx+SW/2,sy+SH/2);
  }
  if(S.bar==='1'){
    ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=6;
    ctx.fillStyle='#fff';ctx.font='600 30px sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';
    const d=new Date();const t=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
    ctx.fillText(t,sx+40,sy+38);
    // wifi bars, signal, battery (right of camera)
    const bx=sx+SW-150;
    ctx.fillRect(bx-86,sy+44,6,10);ctx.fillRect(bx-74,sy+38,6,16);ctx.fillRect(bx-62,sy+32,6,22);ctx.fillRect(bx-50,sy+26,6,28);
    ctx.lineWidth=3;ctx.strokeStyle='#fff';rr(bx-30,sy+26,46,26,7);ctx.stroke();
    ctx.fillRect(bx-26,sy+30,30,18);ctx.fillRect(bx+18,sy+34,4,10);
    ctx.shadowBlur=0;
  }
  if(S.crease==='1'){
    const cx=sx+SW/2;
    const g=ctx.createLinearGradient(cx-18,0,cx+18,0);
    g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.42,'rgba(0,0,0,.20)');
    g.addColorStop(.5,'rgba(255,255,255,.10)');g.addColorStop(.58,'rgba(0,0,0,.16)');g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.fillRect(cx-18,sy,36,SH);
  }
  ctx.restore();
  // camera punch-hole
  ctx.fillStyle='#050507';ctx.beginPath();ctx.arc(sx+SW-62,sy+38,13,0,7);ctx.fill();
  ctx.strokeStyle='rgba(120,130,170,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(sx+SW-62,sy+38,7,0,7);ctx.stroke();
}
document.querySelectorAll('.seg').forEach(g=>g.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  g.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  S[g.dataset.k]=b.dataset.v;draw();
}));
document.getElementById('f').addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;
  const im=new Image();
  im.onload=()=>{img=im;draw();msg.textContent='已生成，可调整选项后保存。'};
  im.onerror=()=>{msg.textContent='这张图读取失败，换一张试试。'};
  im.src=URL.createObjectURL(file);
});
document.getElementById('save').addEventListener('click',()=>{
  if(!img){msg.textContent='先选一张截图。';return}
  cv.toBlob(blob=>{
    const u=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=u;a.download='fold-screenshot.png';
    document.body.appendChild(a);a.click();a.remove();
    msg.textContent='已开始保存，请到「下载」或相册里找 fold-screenshot.png。';
    setTimeout(()=>URL.revokeObjectURL(u),30000);
  },'image/png');
});
draw();
</script>
</body>
</html>
